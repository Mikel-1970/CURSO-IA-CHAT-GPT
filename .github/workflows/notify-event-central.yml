name: Avisos INGITECH desactivados

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      process:
        required: false
        default: proceso
        type: string
      status:
        required: true
        type: string
      version:
        required: false
        default: ""
        type: string
      summary:
        required: true
        type: string
      validate_result:
        required: false
        default: ""
        type: string
      validation_detail:
        required: false
        default: ""
        type: string
      action_required:
        required: false
        default: ""
        type: string
      app_url:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pushover desactivado. No se envía ninguna notificación."
