name: Aviso de app desactivado

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      process:
        required: false
        default: despliegue
        type: string
      version:
        required: false
        default: ""
        type: string
      app_url:
        required: false
        default: ""
        type: string
      build_result:
        required: false
        default: success
        type: string
      deploy_result:
        required: false
        default: success
        type: string
      validate_result:
        required: true
        type: string
      validation_detail:
        required: false
        default: ""
        type: string
      action_required:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pushover desactivado. No se envía ninguna notificación."
